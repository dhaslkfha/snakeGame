<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐍 贪吃蛇游戏</h1>
        
        <div class="game-info">
            <div class="info-item">
                <span class="label">得分:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">最高分:</span>
                <span id="highScore" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">难度:</span>
                <span id="level" class="value">1</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">开始游戏</button>
            <button id="pauseBtn" class="btn btn-pause" disabled>暂停</button>
            <button id="resetBtn" class="btn btn-reset">重新开始</button>
        </div>

        <div class="instructions">
            <h3>操作说明:</h3>
            <ul>
                <li>⬆️ ⬇️ ⬅️ ➡️ 方向键控制蛇的移动</li>
                <li>或使用 W A S D 键控制</li>
                <li>吃到食物得 10 分</li>
                <li>每吃 5 个食物难度提升 1 级</li>
                <li>碰到墙壁或自身游戏结束</li>
            </ul>
        </div>

        <div id="gameOverModal" class="modal hidden">
            <div class="modal-content">
                <h2>游戏结束</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <p id="newRecord" class="hidden">🎉 新高分！</p>
                <button onclick="location.reload()">再玩一次</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
